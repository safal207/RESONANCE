name: RESONANCE Collector Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'collector/**'
      - 'analytics/**'
      - 'site/analytics.js'
      - 'site/measurement.html'
      - 'scripts/verify-collector.mjs'
      - '.github/workflows/collector.yml'
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'analytics/**'
      - 'site/analytics.js'
      - 'site/measurement.html'
      - 'scripts/verify-collector.mjs'
      - '.github/workflows/collector.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: resonance-collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run collector adversarial tests
        run: node --test collector/tests/*.test.mjs

      - name: Verify source and privacy boundary
        run: |
          node scripts/verify-collector.mjs
          cat collector-contract-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Cloudflare Worker bundle without deployment
        run: |
          npx --yes wrangler@4.115.0 deploy \
            --dry-run \
            --config collector/wrangler.jsonc \
            --outdir collector-dist

      - name: Upload immutable collector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-collector-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            analytics/COLLECTOR_DECISION_V0_8.md
            collector/worker.mjs
            collector/wrangler.jsonc
            collector-contract-summary.json
            collector-contract-summary.md
            collector-dist/
          if-no-files-found: warn
          retention-days: 90

      - name: Post or update PR collector summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- resonance-collector-contract -->';
            const fallback = '# RESONANCE Collector Contract v0.8\n\nThe run did not produce a summary. Inspect workflow logs/artifacts.';
            const summary = fs.existsSync('collector-contract-summary.md')
              ? fs.readFileSync('collector-contract-summary.md', 'utf8')
              : fallback;
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
