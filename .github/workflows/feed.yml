name: RESONANCE RSS / Subscribe Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-seo-site.mjs'
      - 'scripts/build-feeds.mjs'
      - 'scripts/verify-feed.mjs'
      - '.github/workflows/feed.yml'
      - '.github/workflows/feed-live.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-seo-site.mjs'
      - 'scripts/build-feeds.mjs'
      - 'scripts/verify-feed.mjs'
      - '.github/workflows/feed.yml'
      - '.github/workflows/feed-live.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: resonance-feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feed-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build SEO-ready publication
        run: node scripts/build-seo-site.mjs

      - name: Build deterministic multilingual feeds
        run: node scripts/build-feeds.mjs

      - name: Verify base publication contract
        run: node scripts/verify-seo.mjs

      - name: Enforce RSS / Subscribe contract
        run: |
          node scripts/verify-feed.mjs \
            --root dist \
            --output feed-results \
            --enforce
          cat feed-results/feed-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable feed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-feed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            feed-results/
            dist/feed.xml
            dist/feed.ru.xml
            dist/feed.zh.xml
            dist/subscribe.html
          if-no-files-found: warn
          retention-days: 90

      - name: Post or update PR feed summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- resonance-feed-contract -->';
            const summaryPath = 'feed-results/feed-summary.md';
            const fallback = '# RESONANCE RSS / Subscribe Contract\n\nThe run did not produce a summary. Inspect workflow logs/artifacts.';
            const body = `${marker}\n${fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : fallback}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
