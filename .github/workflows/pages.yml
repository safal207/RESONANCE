name: Deploy RESONANCE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'issues/001-age-of-agents/README.md'
      - 'issues/001-age-of-agents/articles/**'
      - 'analytics/**'
      - 'scripts/build-publication.mjs'
      - 'scripts/build-issue-web-articles.mjs'
      - 'scripts/build-seo-site.mjs'
      - 'scripts/enhance-search-indexing.mjs'
      - 'scripts/build-feeds.mjs'
      - 'scripts/verify-feed.mjs'
      - 'scripts/verify-analytics.mjs'
      - 'scripts/verify-analytics-live.mjs'
      - 'scripts/verify-seo.mjs'
      - 'scripts/verify-search-indexing.mjs'
      - 'scripts/verify-links.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/feed-live.yml'
      - '.github/workflows/analytics-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      RESONANCE_ANALYTICS_ENDPOINT: ${{ vars.RESONANCE_ANALYTICS_ENDPOINT }}
      RESONANCE_GOOGLE_SITE_VERIFICATION: ${{ vars.RESONANCE_GOOGLE_SITE_VERIFICATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build complete publication
        run: node scripts/build-publication.mjs

      - name: Enhance search indexing graph
        run: node scripts/enhance-search-indexing.mjs

      - name: Build deterministic multilingual feeds
        run: node scripts/build-feeds.mjs

      - name: Verify SEO contract
        run: node scripts/verify-seo.mjs

      - name: Verify search indexing contract
        run: node scripts/verify-search-indexing.mjs

      - name: Verify RSS / Subscribe contract
        run: node scripts/verify-feed.mjs --root dist --output feed-results --enforce

      - name: Verify privacy analytics contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RESONANCE_ANALYTICS_ENDPOINT:-}" ]]; then
            node scripts/verify-analytics.mjs \
              --mode enabled \
              --expected-endpoint "$RESONANCE_ANALYTICS_ENDPOINT"
          else
            node scripts/verify-analytics.mjs --mode disabled
          fi

      - name: Verify internal publication links
        run: node scripts/verify-links.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
