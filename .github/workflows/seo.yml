name: RESONANCE Publication Contract

on:
  pull_request:
    paths:
      - 'site/**'
      - 'market/**'
      - 'distribution/**'
      - 'protocols/**'
      - '.github/ISSUE_TEMPLATE/market-workflow.yml'
      - 'scripts/build-seo-site.mjs'
      - 'scripts/verify-seo.mjs'
      - '.github/workflows/seo.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'market/**'
      - 'distribution/**'
      - 'protocols/**'
      - '.github/ISSUE_TEMPLATE/market-workflow.yml'
      - 'scripts/build-seo-site.mjs'
      - 'scripts/verify-seo.mjs'
      - '.github/workflows/seo.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Market OS scoring and evidence boundaries
        run: node --test market/tests/*.test.mjs

      - name: Build SEO-ready publication
        run: node scripts/build-seo-site.mjs

      - name: Verify SEO contract
        run: node scripts/verify-seo.mjs
