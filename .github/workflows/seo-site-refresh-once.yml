name: Refresh RESONANCE SEO and social metadata

on:
  push:
    branches: [main]
    paths:
      - .github/seo-site-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add canonical metadata, structured data, sitemap, author page, and distribution kit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import html
          import json
          import re
          from urllib.parse import quote

          SITE = Path("site")
          BASE = "https://safal207.github.io/RESONANCE/"
          AUTHOR_URL = BASE + "aleksei-safonov.html"
          AVATAR = "https://avatars.githubusercontent.com/u/55020240?v=4"

          def first(pattern: str, text: str, default: str) -> str:
              match = re.search(pattern, text, re.I | re.S)
              return html.unescape(match.group(1).strip()) if match else default

          def add_before_head_end(text: str, block: str) -> str:
              return text.replace("</head>", block + "\n</head>", 1)

          for page in sorted(SITE.glob("*.html")):
              text = page.read_text(encoding="utf-8")
              name = page.name
              canonical = BASE if name == "index.html" else BASE + quote(name)

              if name == "index.html":
                  new_title = "RESONANCE | Agentic AI Safety, Payments & Verification"
                  new_desc = (
                      "RESONANCE is Aleksei Safonov's evidence-first journal and executable research lab "
                      "for agentic AI safety, agentic payments, verification, reliability, and human progress."
                  )
                  text = re.sub(r"<title>.*?</title>", f"<title>{new_title}</title>", text, count=1, flags=re.I | re.S)
                  text = re.sub(
                      r'<meta\s+name="description"\s+content="[^"]*"\s*/?>',
                      f'<meta name="description" content="{html.escape(new_desc, quote=True)}" />',
                      text,
                      count=1,
                      flags=re.I,
                  )
                  text = re.sub(
                      r'<meta\s+property="og:title"\s+content="[^"]*"\s*/?>',
                      f'<meta property="og:title" content="{html.escape(new_title, quote=True)}" />',
                      text,
                      count=1,
                      flags=re.I,
                  )
                  text = re.sub(
                      r'<meta\s+property="og:description"\s+content="[^"]*"\s*/?>',
                      f'<meta property="og:description" content="{html.escape(new_desc, quote=True)}" />',
                      text,
                      count=1,
                      flags=re.I,
                  )
              else:
                  new_title = first(r"<title>(.*?)</title>", text, page.stem.replace("-", " ").title())
                  new_desc = first(
                      r'<meta\s+name="description"\s+content="([^"]*)"',
                      text,
                      "Evidence-first analysis and reproducible research from RESONANCE.",
                  )

              title = first(r"<title>(.*?)</title>", text, new_title)
              desc = first(
                  r'<meta\s+name="description"\s+content="([^"]*)"',
                  text,
                  new_desc,
              )

              metadata = []
              if 'name="author"' not in text:
                  metadata.append('<meta name="author" content="Aleksei Safonov" />')
              if 'rel="canonical"' not in text:
                  metadata.append(f'<link rel="canonical" href="{canonical}" />')
              if 'property="og:url"' not in text:
                  metadata.append(f'<meta property="og:url" content="{canonical}" />')
              if 'property="og:site_name"' not in text:
                  metadata.append('<meta property="og:site_name" content="RESONANCE" />')
              if 'property="og:image"' not in text:
                  metadata.append(f'<meta property="og:image" content="{AVATAR}" />')
                  metadata.append('<meta property="og:image:alt" content="Aleksei Safonov — RESONANCE" />')
              if 'name="twitter:card"' not in text:
                  metadata.extend([
                      '<meta name="twitter:card" content="summary" />',
                      f'<meta name="twitter:title" content="{html.escape(title, quote=True)}" />',
                      f'<meta name="twitter:description" content="{html.escape(desc, quote=True)}" />',
                      f'<meta name="twitter:image" content="{AVATAR}" />',
                  ])

              if metadata:
                  text = add_before_head_end(text, "  " + "\n  ".join(metadata))

              if 'id="seo-structured-data"' not in text:
                  schema_type = "Blog" if name == "index.html" else "WebPage"
                  schema = {
                      "@context": "https://schema.org",
                      "@type": schema_type,
                      "name": title,
                      "description": desc,
                      "url": canonical,
                      "isPartOf": {
                          "@type": "WebSite",
                          "name": "RESONANCE",
                          "url": BASE,
                      },
                      "author": {
                          "@type": "Person",
                          "name": "Aleksei Safonov",
                          "url": AUTHOR_URL,
                          "sameAs": [
                              "https://github.com/safal207",
                              "https://github.com/safal207/safal207",
                          ],
                      },
                  }
                  script = (
                      '  <script id="seo-structured-data" type="application/ld+json">\n'
                      + json.dumps(schema, ensure_ascii=False, indent=2)
                      + "\n  </script>"
                  )
                  text = add_before_head_end(text, script)

              if name == "index.html" and "By Aleksei Safonov" not in text:
                  text = text.replace(
                      '<div class="hero-kicker">Founding Edition · Issue 001</div>',
                      '<div class="hero-kicker">Founding Edition · Issue 001 · '
                      '<a href="aleksei-safonov.html">By Aleksei Safonov</a></div>',
                      1,
                  )
                  text = text.replace(
                      '<p>© <span id="year">2026</span> RESONANCE</p>',
                      '<p><a href="aleksei-safonov.html">About Aleksei Safonov</a></p>'
                      '<p>© <span id="year">2026</span> RESONANCE</p>',
                      1,
                  )

              page.write_text(text, encoding="utf-8")

          author_schema = {
              "@context": "https://schema.org",
              "@type": "ProfilePage",
              "url": AUTHOR_URL,
              "mainEntity": {
                  "@type": "Person",
                  "name": "Aleksei Safonov",
                  "alternateName": "Alexey Safonov",
                  "url": AUTHOR_URL,
                  "image": AVATAR,
                  "jobTitle": "Smart Contract QA and AI Agent Verification Engineer",
                  "description": (
                      "Independent engineer focused on smart-contract testing, AI-agent verification, "
                      "agentic payments, FinTech reliability, causal audit, and reproducible evidence."
                  ),
                  "sameAs": [
                      "https://github.com/safal207",
                      "https://github.com/safal207/ContractGraph-QA",
                      "https://github.com/safal207/T-Trace",
                      "https://github.com/safal207/ProofPath",
                      "https://github.com/safal207/Causal-Memory-Layer",
                  ],
                  "knowsAbout": [
                      "Smart contract QA",
                      "AI agent verification",
                      "Agentic payments",
                      "FinTech reliability",
                      "State transition testing",
                      "Action receipts",
                      "Causal audit",
                  ],
              },
          }

          author_page = dedent(f'''
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta name="description" content="Aleksei Safonov is an independent Smart Contract QA and AI Agent Verification Engineer focused on FinTech reliability, agentic payments, and reproducible evidence." />
            <meta name="author" content="Aleksei Safonov" />
            <meta name="theme-color" content="#f4f0e8" />
            <link rel="canonical" href="{AUTHOR_URL}" />
            <meta property="og:title" content="Aleksei Safonov | Smart Contract QA & AI Agent Verification" />
            <meta property="og:description" content="Independent verification of smart contracts, payment systems, and AI-agent actions." />
            <meta property="og:type" content="profile" />
            <meta property="og:url" content="{AUTHOR_URL}" />
            <meta property="og:site_name" content="RESONANCE" />
            <meta property="og:image" content="{AVATAR}" />
            <meta name="twitter:card" content="summary" />
            <meta name="twitter:title" content="Aleksei Safonov | Smart Contract QA & AI Agent Verification" />
            <meta name="twitter:description" content="Independent verification of smart contracts, payment systems, and AI-agent actions." />
            <meta name="twitter:image" content="{AVATAR}" />
            <title>Aleksei Safonov | Smart Contract QA & AI Agent Verification</title>
            <link rel="stylesheet" href="styles.css" />
            <link rel="stylesheet" href="article.css" />
            <script id="seo-structured-data" type="application/ld+json">
          {json.dumps(author_schema, ensure_ascii=False, indent=2)}
            </script>
          </head>
          <body>
            <a class="skip-link" href="#main">Skip to content</a>
            <header class="site-header">
              <div class="masthead wrap">
                <a class="brand" href="index.html">RESONANCE</a>
                <p class="masthead-line">Evidence-first research by Aleksei Safonov</p>
              </div>
            </header>
            <main id="main" class="wrap section">
              <article>
                <p class="section-label">Author · Engineer · Independent Researcher</p>
                <h1>Aleksei Safonov</h1>
                <p class="dek"><strong>Smart Contract QA & AI Agent Verification Engineer</strong></p>
                <p>I pressure-test the moment software moves money or claims a real-world result. My work focuses on smart-contract state transitions, payment reconciliation, agentic-payment controls, action receipts, causal lineage, retries, concurrency, stale authority, and reproducible evidence.</p>

                <h2>What I build</h2>
                <ul>
                  <li><a href="https://github.com/safal207/ContractGraph-QA">ContractGraph-QA</a> — smart-contract QA for reachable economic failures and verifiable evidence.</li>
                  <li><a href="https://github.com/safal207/T-Trace">T-Trace / OpenPoC</a> — AI-agent action receipts, deterministic replay, and assurance-boundary tests.</li>
                  <li><a href="https://github.com/safal207/ProofPath">ProofPath</a> — pre-execution authorization and evidence for high-risk agent actions.</li>
                  <li><a href="https://github.com/safal207/Causal-Memory-Layer">Causal Memory Layer</a> — causal and approval-lineage audit for agent traces.</li>
                  <li><a href="index.html">RESONANCE</a> — evidence-first articles, verified reports, open problems, and market questions.</li>
                </ul>

                <h2>Selected proof</h2>
                <p>T-Trace/OpenPoC independently matched 13/13 public Governex action-receipt vectors without importing the reference verifier. Verification-outcome guidance was reviewed and merged into AgenTrust trace-spec, and a Valta pilot completed mutually signed-off tests for payment policy enforcement, concurrency, and retry exposure.</p>

                <h2>Work with me</h2>
                <p>I accept paid, async, fixed-scope engagements for one high-risk smart-contract, payment, or AI-agent workflow at a time.</p>
                <p><a class="button" href="mailto:safal0645@gmail.com?subject=Fixed-scope%20verification%20request">Send the one transition you cannot afford to get wrong</a></p>
                <p><a href="https://github.com/safal207">GitHub profile</a> · <a href="https://t.me/Alexfox14">Telegram</a></p>
              </article>
            </main>
            <footer class="site-footer"><div class="wrap"><a href="index.html">← Back to RESONANCE</a></div></footer>
          </body>
          </html>
          ''').strip() + "\n"
          (SITE / "aleksei-safonov.html").write_text(author_page, encoding="utf-8")

          html_pages = sorted(p.name for p in SITE.glob("*.html") if p.name != "404.html")
          urls = [BASE if name == "index.html" else BASE + quote(name) for name in html_pages]
          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for url in urls:
              sitemap.extend(["  <url>", f"    <loc>{html.escape(url)}</loc>", "  </url>"])
          sitemap.append("</urlset>")
          (SITE / "sitemap.xml").write_text("\n".join(sitemap) + "\n", encoding="utf-8")

          llms = dedent(r'''
          # RESONANCE

          RESONANCE is an evidence-first journal and executable research lab by Aleksei Safonov covering agentic AI safety, agentic payments, verification, reliability, trust infrastructure, science, technology, and human progress.

          ## Canonical entry points

          - Publication: https://safal207.github.io/RESONANCE/
          - Author: https://safal207.github.io/RESONANCE/aleksei-safonov.html
          - GitHub source: https://github.com/safal207/RESONANCE
          - Smart-contract QA: https://github.com/safal207/ContractGraph-QA
          - AI-agent action receipts: https://github.com/safal207/T-Trace
          - Pre-execution agent authorization: https://github.com/safal207/ProofPath
          - Causal agent audit: https://github.com/safal207/Causal-Memory-Layer

          ## Editorial method

          Signal → Cause → Evidence → Causality → Uncertainty → Verification → Implications → Action.

          Claims should distinguish observed facts, verified results, inference, uncertainty, and explicit non-claims. GitHub repositories, executable fixtures, and CI evidence are the canonical technical sources when linked from an article.

          ## Contact

          - Email: safal0645@gmail.com
          - GitHub: https://github.com/safal207
          - Telegram: https://t.me/Alexfox14
          ''').strip() + "\n"
          (SITE / "llms.txt").write_text(llms, encoding="utf-8")

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          marker = "<!-- seo-publication-intro:start -->"
          editorial_heading = "## Editorial model"
          if marker not in readme_text:
              idx = readme_text.find(editorial_heading)
              if idx == -1:
                  raise SystemExit(f"Missing heading: {editorial_heading}")
              intro = dedent(r'''
              <!-- seo-publication-intro:start -->
              # RESONANCE — Agentic AI Safety, Payments & Verification

              **An evidence-first journal and executable research lab by [Aleksei Safonov](https://safal207.github.io/RESONANCE/aleksei-safonov.html).**

              RESONANCE covers agentic AI safety, AI-agent failure modes, agentic payments, payment reconciliation, idempotency, action verification, trust infrastructure, science, technology, entrepreneurship, and human progress.

              > Find the signal. Verify the path. Understand the future.

              Unlike a conventional technology publication, RESONANCE links readable analysis to open-source protocols, deterministic benchmarks, verified reports, primary evidence, and reproducible tests.

              [Read the publication](https://safal207.github.io/RESONANCE/) · [Meet the author](https://safal207.github.io/RESONANCE/aleksei-safonov.html) · [Explore open problems](https://safal207.github.io/RESONANCE/open-problems.html)
              <!-- seo-publication-intro:end -->
              ''').strip()
              readme_text = intro + "\n\n" + readme_text[idx:]
              readme.write_text(readme_text, encoding="utf-8")

          distribution = Path("distribution")
          distribution.mkdir(exist_ok=True)
          kit = dedent(r'''
          # RESONANCE SEO & SMM Distribution Kit

          ## Canonical positioning

          > RESONANCE is an evidence-first journal and executable research lab for agentic AI safety, agentic payments, verification, reliability, and human progress.

          ## Primary search clusters

          - agentic AI safety
          - AI agent failure modes
          - agentic payments
          - AI agent verification
          - payment reconciliation
          - idempotency and retry safety
          - action receipts
          - AI reliability research
          - trust infrastructure

          ## Content series

          1. **Before the Agent Acts** — authorization, intent, authority, policy, and approval.
          2. **After the System Says Done** — receipts, reconciliation, provenance, and unsupported success.
          3. **One Failure, One Invariant** — a minimal executable failure and the reusable lesson.
          4. **Verified Reports** — frozen claims, reproducible benchmarks, and explicit non-claims.
          5. **Open Market Questions** — practitioner questions that can become bounded pilots.

          ## Social post structure

          ```text
          Hook: one dangerous assumption
          Evidence: one exact observed result
          Lesson: one reusable invariant
          Boundary: what remains unproven
          Question: one practitioner-specific prompt
          Link: canonical RESONANCE page with UTM
          ```

          ## Canonical bio

          Aleksei Safonov is an independent Smart Contract QA and AI Agent Verification Engineer. RESONANCE is his evidence-first publication connecting agentic AI research, executable verification, market questions, and product signals.

          ## Recommended repository metadata

          Description:

          > Evidence-first journal and executable research lab for agentic AI safety, payments, reliability, and verification.

          Topics:

          `agentic-ai`, `ai-safety`, `agentic-payments`, `ai-reliability`, `ai-agents`, `verification`, `idempotency`, `payment-systems`, `research`, `technical-writing`, `open-source`
          ''').strip() + "\n"
          (distribution / "SEO_SMM_KIT.md").write_text(kit, encoding="utf-8")

          citation = dedent(r'''
          cff-version: 1.2.0
          message: "If you use a RESONANCE benchmark, protocol, or verified report, cite the specific artifact and this repository."
          title: "RESONANCE: Evidence-First Research on Agentic AI Safety and Reliability"
          type: software
          authors:
            - family-names: "Safonov"
              given-names: "Aleksei"
          repository-code: "https://github.com/safal207/RESONANCE"
          url: "https://safal207.github.io/RESONANCE/"
          license: "Apache-2.0"
          keywords:
            - agentic AI safety
            - agentic payments
            - AI agent verification
            - reliability
            - reproducible research
          ''').strip() + "\n"
          Path("CITATION.cff").write_text(citation, encoding="utf-8")
          PY

          rm -f .github/seo-site-refresh.trigger
          rm -f .github/workflows/seo-site-refresh-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: improve RESONANCE SEO social metadata and author discovery"
          git push
