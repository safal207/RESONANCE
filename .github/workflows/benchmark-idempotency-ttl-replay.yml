name: RESONANCE — Idempotency TTL / Replay After Expiry

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/idempotency-ttl-replay-v1.0/**'
      - '.github/workflows/benchmark-idempotency-ttl-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ttl-replay:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance # fcrp: fixture
          POSTGRES_DB: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://resonance:resonance@127.0.0.1:5432/resonance
      EXTERNAL_BASE_URL: http://127.0.0.1:18082
      HTTP_SERVICE_IMAGE: python:3.12-slim

    steps:
      - name: Checkout RESONANCE
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client driver
        run: python -m pip install 'psycopg[binary]==3.2.9'

      - name: Pull external service image
        run: docker pull "$HTTP_SERVICE_IMAGE"

      - name: Run idempotency TTL replay benchmark
        run: |
          python benchmarks/idempotency-ttl-replay-v1.0/run_ttl_replay.py \
            --out benchmark-results/idempotency-ttl-replay-v1.0

      - name: Capture TTL service logs
        if: always()
        run: docker logs resonance-external-http-ttl || true

      - name: Publish run summary
        if: always()
        run: |
          if [ -f benchmark-results/idempotency-ttl-replay-v1.0/RESULT.md ]; then
            cat benchmark-results/idempotency-ttl-replay-v1.0/RESULT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-idempotency-ttl-replay-v1.0
          path: benchmark-results/idempotency-ttl-replay-v1.0/
          if-no-files-found: error

      - name: Cleanup TTL benchmark resources
        if: always()
        run: |
          docker rm -f resonance-external-http-ttl || true
          docker volume rm -f resonance-idempotency-ttl-v1 || true
