name: RESONANCE — Ambiguous Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/openai-agents-ambiguous-reconciliation-v0.4/**'
      - '.github/workflows/benchmark-openai-agents-ambiguous-reconciliation.yml'

permissions:
  contents: read

jobs:
  ambiguous-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTREAM_SHA: 2231eb5d40cd4a9d6b86f79492e984eeb3301263
    steps:
      - name: Checkout RESONANCE
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch pinned OpenAI Agents SDK
        run: |
          git clone https://github.com/openai/openai-agents-python.git upstream
          git -C upstream checkout "$UPSTREAM_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"

      - name: Install target
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./upstream

      - name: Run ambiguous reconciliation benchmark
        run: |
          python benchmarks/openai-agents-ambiguous-reconciliation-v0.4/run_ambiguous_reconciliation.py \
            --upstream upstream \
            --out benchmark-results/openai-agents-ambiguous-reconciliation-v0.4

      - name: Publish run summary
        if: always()
        run: |
          if [ -f benchmark-results/openai-agents-ambiguous-reconciliation-v0.4/RESULT.md ]; then
            cat benchmark-results/openai-agents-ambiguous-reconciliation-v0.4/RESULT.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-openai-agents-ambiguous-reconciliation-v0.4
          path: benchmark-results/openai-agents-ambiguous-reconciliation-v0.4/
          if-no-files-found: error
