name: RESONANCE Translation Parity Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-seo-site.mjs'
      - 'scripts/verify-seo.mjs'
      - 'scripts/translation-parity.mjs'
      - '.github/workflows/translation-parity.yml'
      - 'SITE_HEALTH.md'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-seo-site.mjs'
      - 'scripts/verify-seo.mjs'
      - 'scripts/translation-parity.mjs'
      - '.github/workflows/translation-parity.yml'
      - 'SITE_HEALTH.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: resonance-translation-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build publication
        run: node scripts/build-seo-site.mjs

      - name: Verify publication contract first
        run: node scripts/verify-seo.mjs

      - name: Enforce managed EN / RU / zh-CN translation parity
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/translation-parity.mjs \
            --root dist \
            --output translation-parity-results \
            --enforce
          cat translation-parity-results/translation-parity-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable translation-parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-translation-parity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: translation-parity-results/
          if-no-files-found: warn
          retention-days: 90

      - name: Post or update PR translation-parity summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- resonance-translation-parity -->';
            const summaryPath = 'translation-parity-results/translation-parity-summary.md';
            const fallback = '# RESONANCE Translation Parity Contract\n\nThe run did not produce a summary. Inspect workflow logs/artifacts.';
            const body = `${marker}\n${fs.existsSync(summaryPath) ? fs.readFileSync(summaryPath, 'utf8') : fallback}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
