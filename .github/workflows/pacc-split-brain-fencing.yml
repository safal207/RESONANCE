name: RESONANCE — PACC Split-Brain Fencing Integrity

on:
  push:
    paths:
      - 'benchmarks/portable-authorization-consumption-v0.7/split_brain_fencing_fixtures.json'
      - 'benchmarks/portable-authorization-consumption-v0.7/run_split_brain_fencing_conformance.py'
      - 'benchmarks/portable-authorization-consumption-v0.7/run_split_brain_fencing_mutation_campaign.py'
      - 'benchmarks/portable-authorization-consumption-v0.7/SPLIT_BRAIN_FENCING.md'
      - '.github/workflows/pacc-split-brain-fencing.yml'
  pull_request:
    paths:
      - 'benchmarks/portable-authorization-consumption-v0.7/split_brain_fencing_fixtures.json'
      - 'benchmarks/portable-authorization-consumption-v0.7/run_split_brain_fencing_conformance.py'
      - 'benchmarks/portable-authorization-consumption-v0.7/run_split_brain_fencing_mutation_campaign.py'
      - 'benchmarks/portable-authorization-consumption-v0.7/SPLIT_BRAIN_FENCING.md'
      - '.github/workflows/pacc-split-brain-fencing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacc-split-brain-fencing-integrity:
    name: PACC split-brain fencing integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout RESONANCE
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run PACC split-brain fencing conformance
        run: |
          mkdir -p benchmark-results/pacc-split-brain-fencing-integrity
          python benchmarks/portable-authorization-consumption-v0.7/run_split_brain_fencing_conformance.py \
            --output benchmark-results/pacc-split-brain-fencing-integrity/conformance.json

      - name: Run PACC split-brain fencing mutation campaign
        run: |
          python benchmarks/portable-authorization-consumption-v0.7/run_split_brain_fencing_mutation_campaign.py \
            --required-score 1.0 \
            --output benchmark-results/pacc-split-brain-fencing-integrity/mutation-campaign.json

      - name: Publish PACC split-brain fencing summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path('benchmark-results/pacc-split-brain-fencing-integrity')
          print('## PACC Split-Brain Fencing Integrity')
          for label, name in [
              ('Split-brain fencing conformance', 'conformance.json'),
              ('Split-brain fencing mutation campaign', 'mutation-campaign.json'),
          ]:
              path = root / name
              if not path.exists():
                  print(f'- {label}: NOT_RUN')
                  continue
              summary = json.loads(path.read_text(encoding='utf-8')).get('summary', {})
              print(f'- {label}: {summary.get("status", "UNKNOWN")} — {summary}')
          PY

      - name: Upload PACC split-brain fencing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonance-pacc-split-brain-fencing-integrity
          path: benchmark-results/pacc-split-brain-fencing-integrity/
          if-no-files-found: warn
